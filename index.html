<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پورتال مدرسه</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#1d2433;--mu:#667085;--br:#d9deea;--pr:#2457c5;--prt:#fff;--ok:#117a45;--wn:#a15c07;--me:#e3ecff;--ot:#eef0f5}
@media (prefers-color-scheme:dark){:root{--bg:#121620;--card:#1b2130;--tx:#e8ecf5;--mu:#98a2b8;--br:#2b3347;--pr:#6b9bff;--prt:#0b1020;--ok:#4cc38a;--wn:#f0b45a;--me:#25355c;--ot:#262e42}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.7}
header{padding:14px 16px;background:var(--card);border-bottom:1px solid var(--br);display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:18px;margin:0}
nav{display:flex;gap:6px;padding:10px 16px;overflow-x:auto}
nav button{background:var(--card);border:1px solid var(--br);color:var(--tx);padding:8px 16px;border-radius:20px;font:inherit;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--pr);color:var(--prt);border-color:var(--pr)}
main{max-width:860px;margin:0 auto;padding:0 16px 32px}
.card{background:var(--card);border:1px solid var(--br);border-radius:12px;padding:16px;margin-bottom:14px}
.banner{padding:10px 14px;border-radius:10px;margin-bottom:14px;font-size:14px;border:1px solid var(--br);background:var(--card)}
.ok{color:var(--ok)}.wn{color:var(--wn)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:3px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--br);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.ltr{direction:ltr;text-align:right}
h3{margin:18px 0 8px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{display:flex;align-items:center;gap:5px;color:var(--tx);border:1px solid var(--br);padding:5px 10px;border-radius:16px;margin:0}
.chips input{width:auto}
.btn{background:var(--pr);color:var(--prt);border:0;padding:10px 20px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:var(--ot);color:var(--tx)}.btn.sm{padding:4px 12px;font-size:13px}
.err{font-size:13px;margin-top:6px;min-height:20px;color:#c0392b}
#msgs{height:55vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.m{max-width:80%;padding:8px 12px;border-radius:12px;background:var(--ot);align-self:flex-start;word-break:break-word}
.m.me{background:var(--me);align-self:flex-end}
.m b{font-size:12px;color:var(--mu);display:block}
.m .x{cursor:pointer;color:var(--mu);margin-inline-start:8px}
#cf,.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#cf{margin-top:10px;flex-wrap:nowrap}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px;border-bottom:1px solid var(--br);text-align:right;vertical-align:top}
.tw{overflow-x:auto}.det{background:var(--bg);font-size:13px;color:var(--mu)}
.tag{padding:2px 10px;border-radius:12px;font-size:12px;background:var(--ot)}
.hide{display:none}
.stk{font-size:56px;line-height:1.2}
.m img{max-width:100%;max-height:240px;border-radius:8px;display:block;margin-top:4px}
.m a{color:var(--pr)}
#auth{max-width:380px;margin:40px auto}
</style>
</head>
<body>
<header><h1>🏫 پورتال مدیر و همکاران</h1><div class="row"><span id="who" class="tag hide"></span><button class="btn sec sm hide" id="out">خروج</button></div></header>

<main>
<section id="auth" class="card">
<div id="loginbox">
<h3 style="margin-top:0">ورود</h3>
<label>نام کاربری (کد پرسنلی)</label><input id="un" class="ltr" autocomplete="username">
<label style="margin-top:8px">رمز عبور (برای بار اول: همان کد پرسنلی)</label><input id="pw" type="password" class="ltr" autocomplete="current-password">
<div class="err" id="aerr"></div>
<div class="row"><button class="btn" id="li">ورود</button><button class="btn sec" id="showreg">ثبت‌نام اولیه</button></div>
</div>
<div id="regbox" class="hide">
<h3 style="margin-top:0">ثبت‌نام اولیه همکار</h3>
<label>کد پرسنلی (۸ رقم)</label><input id="rc" class="ltr" inputmode="numeric" maxlength="8">
<label style="margin-top:8px">نام و نام خانوادگی</label><input id="rn">
<label style="margin-top:8px">تلفن همراه</label><input id="rm" class="ltr" inputmode="tel">
<div class="err" id="rerr"></div>
<div class="row"><button class="btn" id="rb">ثبت درخواست</button><button class="btn sec" id="backlogin">بازگشت به ورود</button></div>
</div>
</section>

<div id="app" class="hide">
<nav id="nav" style="padding-inline:0"></nav>
<div id="banner"></div>

<section id="v-form" class="card hide">
<h3 style="margin-top:0">مشخصات فردی</h3>
<div class="grid">
<div><label>نام و نام خانوادگی *</label><input id="full_name"></div>
<div><label>کد ملی (۱۰ رقم) *</label><input id="national_id" class="ltr" inputmode="numeric" maxlength="10"></div>
<div><label>کد پرسنلی (۸ رقم) *</label><input id="personnel_code" class="ltr" inputmode="numeric" maxlength="8"></div>
<div><label>تلفن همراه *</label><input id="mobile" class="ltr" inputmode="tel"></div>
<div><label>تلفن ثابت</label><input id="home_phone" class="ltr" inputmode="tel"></div>
<div><label>تلفن اضطراری</label><input id="emergency_phone" class="ltr" inputmode="tel"></div>
</div>
<h3>تحصیلات و تدریس</h3>
<div class="grid">
<div><label>مدرک تحصیلی *</label><select id="degree"><option value="">انتخاب کنید</option><option>دیپلم</option><option>فوق دیپلم</option><option>لیسانس</option><option>فوق لیسانس</option><option>دکتری</option></select></div>
<div><label>رشته تحصیلی *</label><input id="field_of_study"></div>
<div><label>رشته تدریس *</label><input id="teaching_field"></div>
<div><label>سمت</label><input id="position"></div>
<div><label>سابقه خدمت (سال)</label><input id="service_years" type="number" min="0" max="60"></div>
</div>
<label style="margin-top:10px">پایه‌های تدریس</label><div class="chips" id="grades"></div>
<label style="margin-top:10px">روزهای همکاری</label><div class="chips" id="days"></div>
<h3>وضعیت خانوادگی</h3>
<div class="grid">
<div><label>نام همسر</label><input id="spouse_name"></div>
<div><label>شغل همسر</label><input id="spouse_job"></div>
<div><label>تلفن همسر</label><input id="spouse_phone" class="ltr" inputmode="tel"></div>
<div><label>تعداد فرزند</label><input id="children" type="number" min="0" max="30"></div>
</div>
<h3>نشانی</h3>
<label>آدرس محل سکونت *</label><textarea id="address" rows="3"></textarea>
<div class="err" id="ferr"></div>
<div class="row"><button class="btn" id="save">ثبت اطلاعات</button><button class="btn sec" id="prt">🖨 چاپ / ذخیره PDF فرم مشخصات</button></div>
</section>

<section id="v-docs" class="card hide">
<h3 style="margin-top:0">ارسال مدارک برای مدیر</h3>
<div class="grid" style="max-width:640px"><div><label>نوع مدرک</label><select id="dcat"></select></div>
<div><label>فایل (PDF یا عکس، حداکثر ۱۰ مگابایت)</label><input type="file" id="dfile" accept=".pdf,.jpg,.jpeg,.png,.webp"></div></div>
<div class="err" id="derr"></div><button class="btn" id="dup">ارسال مدرک</button>
<h3>مدارک ارسال‌شده</h3><div id="dlist" class="tw"></div>
</section>

<section id="v-chat" class="card hide">
<div id="chatlock" class="banner wn hide">گفتگو پس از تأیید مدیر فعال می‌شود.</div>
<div id="msgs"></div>
<div id="sp" class="chips hide" style="margin-top:10px"></div>
<div id="cf"><button class="btn sec" id="sk" title="استیکر">😀</button><button class="btn sec" id="at" title="ارسال فایل">📎</button><input type="file" id="fi" class="hide"><input id="ct" placeholder="پیام خود را بنویسید…" maxlength="1000"><button class="btn" id="cs">ارسال</button></div>
</section>

<section id="v-admin" class="card hide">
<h3 style="margin-top:0">درخواست‌های ثبت‌نام</h3><div id="regs" class="tw" style="margin-bottom:8px"></div>
<h3>همکاران</h3>
<div class="row" style="margin-bottom:10px">
<input id="q" placeholder="جستجو: نام، کد ملی، کد پرسنلی…" style="flex:1;min-width:180px">
<button class="btn sec" id="rf">بازخوانی</button>
<button class="btn sec" id="fl">فقط در انتظار تأیید</button>
<button class="btn" id="ex">خروجی اکسل (CSV)</button>
</div>
<div class="tw"><table><thead><tr><th>نام</th><th>کد پرسنلی</th><th>رشته تدریس</th><th>وضعیت</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>
<div id="empty" class="banner hide">هنوز ثبت‌نامی انجام نشده است.</div>
</section>

<section id="v-acct" class="card hide">
<h3 style="margin-top:0">تغییر رمز عبور</h3>
<div class="grid" style="max-width:600px">
<div><label>رمز جدید (حداقل ۸ نویسه)</label><input id="np1" type="password" class="ltr" autocomplete="new-password"></div>
<div><label>تکرار رمز جدید</label><input id="np2" type="password" class="ltr" autocomplete="new-password"></div>
</div>
<div class="err" id="perr"></div>
<button class="btn" id="pb">تغییر رمز</button>
</section>
</div>
</main>

<script>
// ===== تنظیمات: مقادیر را از Supabase > Project Settings > API کپی کنید =====
const SUPABASE_URL='https://yxtwcrrcydcanbshpovf.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4dHdjcnJjeWRjYW5ic2hwb3ZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5NzkyMDIsImV4cCI6MjEwNjU1NTIwMn0.EyKpBsbSvu2zsOuhcW9kIzjlZV8tBexy8gHBoET5uWc';
// ایمیل داخلی حساب‌ها (ایمیل واقعی ارسال نمی‌شود). از نشانی Gmail خودتان استفاده می‌شود:
const EMAIL_BASE='babakbahramipour', EMAIL_DOMAIN='gmail.com';
const authEmail=c=>`${EMAIL_BASE}+sp${c}@${EMAIL_DOMAIN}`;
// ============================================================================
let sb,initErr='';
try{if(typeof supabase==='undefined')initErr='lib';else if(!/^https:\/\/[a-z0-9]+\.supabase\.co$/.test(SUPABASE_URL))initErr='url';else sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY)}catch(e){initErr='url'}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dig=s=>String(s||'').replace(/[۰-۹]/g,d=>d.charCodeAt(0)-1776).replace(/[٠-٩]/g,d=>d.charCodeAt(0)-1632).trim();
const DAYS=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه'];
const GR=['اول','دوم','سوم','چهارم','پنجم','ششم','هفتم','هشتم','نهم','دهم','یازدهم','دوازدهم'];
const TXT=['full_name','national_id','personnel_code','mobile','home_phone','emergency_phone','degree','field_of_study','teaching_field','position','service_years','spouse_name','spouse_job','spouse_phone','children','address'];
const NUM=['service_years','children'];
let me=null,tab='form',list=[],msgs=[],open=null,onlyPending=false,chan=null,filled=false;
const chips=(id,arr)=>$(id).innerHTML=arr.map(d=>`<label><input type="checkbox" value="${d}">${d}</label>`).join('');
chips('#days',DAYS);chips('#grades',GR);
const checked=id=>[...document.querySelectorAll(id+' input:checked')].map(i=>i.value);
function validId(c){if(!/^\d{10}$/.test(c)||/^(\d)\1{9}$/.test(c))return false;let s=0;for(let i=0;i<9;i++)s+=+c[i]*(10-i);const r=s%11;return +c[9]===(r<2?r:11-r)}

// ---- ورود و ثبت‌نام ----
function aerr(m,good){const e=$('#aerr');e.textContent=m;e.style.color=good?'var(--ok)':'#c0392b'}
$('#li').onclick=async()=>{
  const u=dig($('#un').value);let p=$('#pw').value;if(/^[0-9۰-۹٠-٩]+$/.test(p))p=dig(p);
  if(!u||!p)return;aerr('در حال ورود…',true);
  try{const {data:em}=await sb.rpc('login_email',{u});
    if(!em){aerr('نام کاربری یا رمز نادرست است، یا ثبت‌نام شما هنوز تأیید نشده است.');return}
    const {error}=await sb.auth.signInWithPassword({email:em,password:p});
    aerr(error?(/Invalid login/i.test(error.message)?'نام کاربری یا رمز نادرست است.':'خطا: '+error.message):'')}
  catch(e){aerr('اتصال به Supabase برقرار نشد. اینترنت یا فیلترشکن را بررسی کنید.')}};
$('#pw').onkeydown=e=>{if(e.key==='Enter')$('#li').click()};
$('#showreg').onclick=()=>{$('#loginbox').classList.add('hide');$('#regbox').classList.remove('hide')};
$('#backlogin').onclick=()=>{$('#regbox').classList.add('hide');$('#loginbox').classList.remove('hide')};
$('#rb').onclick=async()=>{
  const c=dig($('#rc').value),n=$('#rn').value.trim(),m=dig($('#rm').value),e=$('#rerr');e.style.color='#c0392b';e.textContent='';
  if(!/^\d{8}$/.test(c)){e.textContent='کد پرسنلی باید دقیقاً ۸ رقم باشد.';return}
  if(!n||!m){e.textContent='نام و تلفن همراه را وارد کنید.';return}
  const {data,error}=await sb.rpc('register_staff',{p_code:c,p_name:n,p_mobile:m});
  if(error){e.textContent='ثبت نشد: '+error.message;return}
  if(data==='exists'){e.textContent='برای این کد پرسنلی قبلاً درخواست ثبت شده است.';return}
  if(data!=='ok'){e.textContent='اطلاعات نامعتبر است.';return}
  e.style.color='var(--ok)';e.textContent='درخواست شما ثبت شد. پس از تأیید مدیر، با کد پرسنلی (به‌عنوان نام کاربری و رمز اولیه) وارد شوید.'};
$('#out').onclick=()=>sb.auth.signOut();
$('#pb').onclick=async()=>{const a=$('#np1').value,e=$('#perr');e.style.color='#c0392b';
  if(a.length<8){e.textContent='رمز باید حداقل ۸ نویسه باشد.';return}
  if(a!==$('#np2').value){e.textContent='تکرار رمز مطابقت ندارد.';return}
  if(me&&a===me.personnel_code){e.textContent='رمز جدید نباید همان کد پرسنلی باشد.';return}
  const {error}=await sb.auth.updateUser({password:a});
  if(error){e.textContent='تغییر رمز انجام نشد: '+error.message;return}
  await sb.rpc('password_changed');if(me)me.must_change=false;
  $('#np1').value=$('#np2').value='';e.style.color='var(--ok)';e.textContent='رمز با موفقیت تغییر کرد.';render()};

if(initErr){['li','rb'].forEach(i=>$('#'+i).disabled=true);aerr(initErr==='lib'?'کتابخانه Supabase بارگذاری نشد. اینترنت یا فیلترشکن را بررسی کنید.':'SUPABASE_URL درست وارد نشده است. باید شبیه https://xxxx.supabase.co باشد، بدون / آخر و بدون rest/v1.')}
else sb.auth.onAuthStateChange((ev,s)=>{if(ev==='TOKEN_REFRESHED')return;if(ev==='PASSWORD_RECOVERY')tab='acct';setTimeout(()=>onSession(s),0)});

async function onSession(s){
  if(chan){sb.removeChannel(chan);chan=null}
  if(!s){me=null;msgs=[];list=[];filled=false;$('#auth').classList.remove('hide');$('#app').classList.add('hide');$('#out').classList.add('hide');$('#who').classList.add('hide');return}
  const {data,error:pe}=await sb.from('profiles').select('*').eq('id',s.user.id).single();
  me=data;filled=false;
  $('#auth').classList.add('hide');$('#app').classList.remove('hide');$('#out').classList.remove('hide');$('#who').classList.remove('hide');
  if(!me){$('#banner').className='banner wn';$('#banner').textContent='ورود انجام شد اما پروفایل شما خوانده نشد'+(pe?': '+pe.message:'')+'. مطمئن شوید schema.sql کامل اجرا شده و برای این کاربر ردیف پروفایل ساخته شده است.';return}
  if(me&&(me.approved||me.role==='admin')){await loadMsgs();subscribe()}
  if(me?.role==='admin')await loadList();
  await loadDocs();
  render();
}

// ---- نمایش ----
const isAdm=()=>me?.role==='admin',canChat=()=>me?.approved||isAdm();
function render(){
  if(!me)return;
  const tabs=[['form','مشخصات من'],['docs','مدارک من'],['chat','گفتگو']];if(isAdm())tabs.push(['admin','پنل مدیر']);tabs.push(['acct','حساب']);
  if(me.must_change){tabs.length=0;tabs.push(['acct','حساب']);tab='acct'}
  if(!tabs.some(t=>t[0]===tab))tab='form';
  $('#nav').innerHTML=tabs.map(([k,l])=>`<button class="${k===tab?'on':''}" data-t="${k}">${l}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
  ['form','docs','chat','admin','acct'].forEach(k=>$('#v-'+k).classList.toggle('hide',k!==tab));
  $('#who').textContent=isAdm()?'مدیر':(me.approved?'همکار تأییدشده':'ثبت‌نام اولیه');
  const b=$('#banner');
  if(me.must_change){b.className='banner wn';b.textContent='برای ادامه، رمز عبور پیش‌فرض را در همین صفحه تغییر دهید.'}
  else if(isAdm()){b.className='banner ok';b.textContent='شما با دسترسی مدیر وارد شده‌اید.'}
  else if(!me.full_name){b.className='banner wn';b.textContent='برای تکمیل ثبت‌نام، فرم مشخصات را پر و ثبت کنید.'}
  else if(!me.approved){b.className='banner wn';b.textContent='اطلاعات شما ثبت شد و در انتظار تأیید مدیر است.'}
  else{b.className='banner ok';b.textContent='ثبت‌نام شما تأیید شده است.'}
  if(!filled){TXT.forEach(k=>$('#'+k).value=me[k]??'');
    document.querySelectorAll('#days input').forEach(i=>i.checked=(me.work_days||[]).includes(i.value));
    document.querySelectorAll('#grades input').forEach(i=>i.checked=(me.grades||[]).includes(i.value));filled=true}
  $('#personnel_code').disabled=!isAdm();
  $('#chatlock').classList.toggle('hide',canChat());$('#cf').classList.toggle('hide',!canChat());
  renderChat();if(isAdm())renderAdmin();
}

$('#save').onclick=async()=>{
  const d={},e=$('#ferr');e.style.color='#c0392b';e.textContent='';
  TXT.forEach(k=>{const v=dig($('#'+k).value);d[k]=NUM.includes(k)?(v===''?null:+v):v});
  d.work_days=checked('#days');d.grades=checked('#grades');d.updated_at=new Date().toISOString();
  if(!d.full_name||!d.mobile||!d.degree||!d.field_of_study||!d.teaching_field||!d.address){e.textContent='لطفاً همه فیلدهای ستاره‌دار را پر کنید.';return}
  if(!validId(d.national_id)){e.textContent='کد ملی معتبر نیست.';return}
  if(!/^\d{8}$/.test(d.personnel_code)){e.textContent='کد پرسنلی باید دقیقاً ۸ رقم باشد.';return}
  const {error}=await sb.from('profiles').update(d).eq('id',me.id);
  if(error){e.textContent='ذخیره نشد: '+error.message;return}
  me={...me,...d};if(isAdm()){const r=await sb.from('profiles').select('*').eq('id',me.id).single();if(r.data)me=r.data}e.style.color='var(--ok)';e.textContent='اطلاعات با موفقیت ذخیره شد.';render();setTimeout(()=>e.textContent='',3000);
};

// ---- گفتگو ----
async function loadMsgs(){const {data}=await sb.from('messages').select('*').order('created_at',{ascending:false}).limit(200);msgs=(data||[]).reverse()}
function subscribe(){
  chan=sb.channel('msgs')
   .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},p=>{msgs.push(p.new);renderChat()})
   .on('postgres_changes',{event:'DELETE',schema:'public',table:'messages'},p=>{msgs=msgs.filter(m=>m.id!==p.old.id);renderChat()})
   .subscribe();
}
const urlCache={};
async function fileUrl(p,dl){const k=p+(dl?'|d':'');if(!urlCache[k]){const {data}=await sb.storage.from('chat-files').createSignedUrl(p,3600,dl?{download:true}:undefined);urlCache[k]=data?.signedUrl||''}return urlCache[k]}
function renderChat(){
  const box=$('#msgs'),near=box.scrollHeight-box.scrollTop-box.clientHeight<80;box.innerHTML='';
  if(!canChat())return;
  msgs.forEach(m=>{const d=document.createElement('div');d.className='m'+(m.user_id===me.id?' me':'');
    const n=document.createElement('b');n.textContent=m.author||'';d.append(n);
    if(m.kind==='sticker'){const s=document.createElement('div');s.className='stk';s.textContent=m.body;d.append(s)}
    else if(m.kind==='file'){const a=document.createElement('a');a.textContent='📎 '+(m.file_name||'فایل');a.href='#';
      a.onclick=async e=>{e.preventDefault();const u=await fileUrl(m.file_path,true);if(u)window.open(u,'_blank')};d.append(a);
      if((m.file_type||'').startsWith('image/'))fileUrl(m.file_path).then(u=>{if(!u)return;const i=document.createElement('img');i.src=u;i.onload=()=>{if(near)box.scrollTop=box.scrollHeight};a.after(i)})}
    else{const t=document.createElement('span');t.textContent=m.body;d.append(t)}
    if(isAdm()||m.user_id===me.id){const x=document.createElement('span');x.className='x';x.textContent='✕';
      x.onclick=async()=>{if(m.file_path)await sb.storage.from('chat-files').remove([m.file_path]);sb.from('messages').delete().eq('id',m.id)};d.append(x)}
    box.append(d)});
  if(near)box.scrollTop=box.scrollHeight;
}
async function sendRow(row){const {error}=await sb.from('messages').insert(row);if(error)alert('ارسال نشد: '+error.message)}
async function send(){const t=$('#ct').value.trim();if(!t)return;$('#ct').value='';const {error}=await sb.from('messages').insert({body:t});if(error)$('#ct').value=t}
$('#cs').onclick=send;$('#ct').onkeydown=e=>{if(e.key==='Enter')send()};
const STK=['👍','👏','🙏','❤️','😂','😍','😢','😮','🎉','✅','❌','🌹','📚','✏️','🏫','⏰'];
$('#sp').innerHTML=STK.map(x=>`<button class="btn sec" data-s="${x}" style="font-size:26px">${x}</button>`).join('');
$('#sp').querySelectorAll('button').forEach(b=>b.onclick=()=>{$('#sp').classList.add('hide');sendRow({kind:'sticker',body:b.dataset.s})});
$('#sk').onclick=()=>$('#sp').classList.toggle('hide');
$('#at').onclick=()=>$('#fi').click();
$('#fi').onchange=async()=>{const f=$('#fi').files[0];$('#fi').value='';if(!f)return;
  if(f.size>10*1024*1024){alert('حجم فایل نباید بیشتر از ۱۰ مگابایت باشد.');return}
  const ext=(f.name.split('.').pop()||'bin').replace(/[^a-zA-Z0-9]/g,'').slice(0,8)||'bin';
  const path=`${me.id}/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
  const {error}=await sb.storage.from('chat-files').upload(path,f,{contentType:f.type||'application/octet-stream'});
  if(error){alert('آپلود فایل انجام نشد: '+error.message);return}
  sendRow({kind:'file',body:'',file_path:path,file_name:f.name.slice(0,120),file_type:f.type||''})};

// ---- مدارک ----
const CATS={birth_certificate:'شناسنامه (همه صفحات)',national_card:'کارت ملی',appreciation:'تقدیرنامه',inservice:'لیست دوره‌های ضمن خدمت',plan_daily:'طرح درس روزانه',plan_annual:'طرح درس سالانه',other:'سایر مدارک'};
$('#dcat').innerHTML=Object.entries(CATS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
let mydocs=[];
const docUrl=async p=>{const {data}=await sb.storage.from('staff-docs').createSignedUrl(p,600);return data?.signedUrl};
async function loadDocs(){if(!me)return;const {data}=await sb.from('documents').select('*').eq('user_id',me.id).order('created_at',{ascending:false});mydocs=data||[];renderDocs()}
function renderDocs(){
  $('#dlist').innerHTML=mydocs.length?`<table><tbody>${mydocs.map(d=>`<tr><td>${esc(CATS[d.category]||d.category)}</td><td>${esc(d.file_name)}</td><td>${new Date(d.created_at).toLocaleDateString('fa-IR')}</td><td><button class="btn sec sm" data-v="${d.id}">مشاهده</button> <button class="btn sec sm" data-x="${d.id}">حذف</button></td></tr>`).join('')}</tbody></table>`:'<div class="banner">هنوز مدرکی ارسال نکرده‌اید.</div>';
  $('#dlist').querySelectorAll('[data-v]').forEach(b=>b.onclick=async()=>{const d=mydocs.find(x=>x.id==b.dataset.v);const u=await docUrl(d.file_path);if(u)window.open(u,'_blank')});
  $('#dlist').querySelectorAll('[data-x]').forEach(b=>b.onclick=async()=>{const d=mydocs.find(x=>x.id==b.dataset.x);if(!confirm('این مدرک حذف شود؟'))return;
    await sb.storage.from('staff-docs').remove([d.file_path]);await sb.from('documents').delete().eq('id',d.id);await loadDocs()});
}
$('#dup').onclick=async()=>{
  const f=$('#dfile').files[0],e=$('#derr');e.style.color='#c0392b';e.textContent='';
  if(!f){e.textContent='فایلی انتخاب نشده است.';return}
  if(f.size>10*1024*1024){e.textContent='حجم فایل نباید بیشتر از ۱۰ مگابایت باشد.';return}
  if(!/^(application\/pdf|image\/(jpeg|png|webp))$/.test(f.type)){e.textContent='فقط PDF یا عکس (JPG، PNG، WebP) مجاز است.';return}
  const ext=(f.name.split('.').pop()||'bin').replace(/[^a-zA-Z0-9]/g,'').slice(0,8)||'bin';
  const path=`${me.id}/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
  $('#dup').disabled=true;
  const up=await sb.storage.from('staff-docs').upload(path,f,{contentType:f.type});
  if(up.error){e.textContent='آپلود انجام نشد: '+up.error.message;$('#dup').disabled=false;return}
  const ins=await sb.from('documents').insert({category:$('#dcat').value,file_name:f.name.slice(0,120),file_path:path,file_type:f.type,size:f.size});
  $('#dup').disabled=false;
  if(ins.error){await sb.storage.from('staff-docs').remove([path]);e.textContent='ثبت مدرک انجام نشد: '+ins.error.message;return}
  $('#dfile').value='';e.style.color='var(--ok)';e.textContent='مدرک ارسال شد.';await loadDocs();
};
async function loadAdminDocs(id){
  const {data}=await sb.from('documents').select('*').eq('user_id',id).order('created_at');const el=document.getElementById('dl-'+id);if(!el)return;
  el.innerHTML=(data||[]).length?data.map(d=>`<div><a href="#" data-du="${esc(d.file_path)}">${esc(CATS[d.category]||d.category)}: ${esc(d.file_name)}</a></div>`).join(''):'مدرکی ارسال نشده است.';
  el.querySelectorAll('[data-du]').forEach(a=>a.onclick=async ev=>{ev.preventDefault();const u=await docUrl(a.dataset.du);if(u)window.open(u,'_blank')});
}

// ---- چاپ فرم مشخصات (از پنجره چاپ مرورگر گزینه «Save as PDF» را انتخاب کنید) ----
function printForm(p){
  if(!p)return;
  const rows=[['نام و نام خانوادگی',p.full_name],['کد ملی',p.national_id],['کد پرسنلی',p.personnel_code],['تلفن همراه',p.mobile],['تلفن ثابت',p.home_phone],['تلفن اضطراری',p.emergency_phone],['مدرک تحصیلی',p.degree],['رشته تحصیلی',p.field_of_study],['رشته تدریس',p.teaching_field],['سمت',p.position],['سابقه خدمت (سال)',p.service_years],['پایه‌های تدریس',(p.grades||[]).join('، ')],['روزهای همکاری',(p.work_days||[]).join('، ')],['نام همسر',p.spouse_name],['شغل همسر',p.spouse_job],['تلفن همسر',p.spouse_phone],['تعداد فرزند',p.children],['آدرس',p.address]];
  const w=window.open('','_blank');if(!w){alert('اجازه باز شدن پنجره جدید را به سایت بدهید.');return}
  w.document.write(`<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>فرم مشخصات - ${esc(p.full_name)}</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet"><style>@page{size:A4;margin:14mm}body{font-family:Vazirmatn,Tahoma,sans-serif;color:#000;line-height:1.7}h1{text-align:center;font-size:20px;margin:0 0 4px}.d{text-align:center;font-size:12px;margin-bottom:14px}table{width:100%;border-collapse:collapse}td{border:1px solid #444;padding:7px 10px;font-size:13px;vertical-align:top}td:first-child{width:30%;background:#eee;font-weight:600}.sig{display:flex;justify-content:space-between;margin-top:48px;font-size:13px}</style></head><body><h1>فرم مشخصات همکار</h1><div class="d">تاریخ چاپ: ${new Date().toLocaleDateString('fa-IR')}</div><table>${rows.map(([k,v])=>`<tr><td>${k}</td><td>${esc(v)}</td></tr>`).join('')}</table><div class="sig"><span>امضای همکار</span><span>امضای مدیر</span></div></body></html>`);
  w.document.close();setTimeout(()=>{w.focus();w.print()},1200);
}
$('#prt').onclick=()=>{if(!me||!me.full_name||!me.national_id){alert('ابتدا اطلاعات فرم را ثبت کنید.');return}printForm(me)};

// ---- پنل مدیر ----
let regs=[];
async function loadList(){const {data}=await sb.from('profiles').select('*').eq('role','teacher').order('created_at');list=data||[];const r=await sb.from('registrations').select('*').eq('status','pending').order('created_at');regs=r.data||[]}
function renderAdmin(){
  $('#regs').innerHTML=regs.length?`<table><tbody>${regs.map(r=>`<tr><td>${esc(r.full_name)}</td><td dir="ltr">${esc(r.personnel_code)}</td><td dir="ltr">${esc(r.mobile)}</td><td><button class="btn sm" data-ra="${esc(r.personnel_code)}">تأیید</button> <button class="btn sec sm" data-rr="${esc(r.personnel_code)}">رد</button></td></tr>`).join('')}</tbody></table>`:'<div class="banner">درخواست جدیدی وجود ندارد.</div>';
  $('#regs').querySelectorAll('[data-ra]').forEach(b=>b.onclick=async()=>{b.disabled=true;const c=b.dataset.ra;
    const r=await sb.rpc('set_registration',{p_code:c,p_status:'approved'});if(r.error){alert(r.error.message);b.disabled=false;return}
    const tmp=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
    const u=await tmp.auth.signUp({email:authEmail(c),password:c});
    if(u.error){await sb.rpc('set_registration',{p_code:c,p_status:'pending'});alert('ساخت حساب انجام نشد: '+u.error.message);b.disabled=false;return}
    await loadList();renderAdmin()});
  $('#regs').querySelectorAll('[data-rr]').forEach(b=>b.onclick=async()=>{await sb.rpc('set_registration',{p_code:b.dataset.rr,p_status:'rejected'});await loadList();renderAdmin()});
  const q=dig($('#q').value);
  let L=list.filter(s=>!q||[s.full_name,s.national_id,s.personnel_code,s.teaching_field].some(v=>String(v||'').includes(q)));
  if(onlyPending)L=L.filter(s=>!s.approved);
  $('#empty').classList.toggle('hide',list.length>0);$('#fl').textContent=onlyPending?'نمایش همه':'فقط در انتظار تأیید';
  $('#tb').innerHTML=L.map(s=>`<tr><td><a href="#" data-d="${esc(s.id)}">${esc(s.full_name||s.email)}</a></td><td dir="ltr">${esc(s.personnel_code)}</td><td>${esc(s.teaching_field)}</td><td><span class="tag ${s.approved?'ok':'wn'}">${s.approved?'تأییدشده':'در انتظار'}</span></td><td><button class="btn sm ${s.approved?'sec':''}" data-a="${esc(s.id)}">${s.approved?'لغو تأیید':'تأیید'}</button></td></tr>`+(open===s.id?`<tr><td colspan="5" class="det">ایمیل: ${esc(s.email)} | کد ملی: ${esc(s.national_id)} | مدرک: ${esc(s.degree)} ${esc(s.field_of_study)}<br>سمت: ${esc(s.position)} | سابقه: ${esc(s.service_years)} سال | پایه‌ها: ${esc((s.grades||[]).join('، '))} | روزها: ${esc((s.work_days||[]).join('، '))}<br>همسر: ${esc(s.spouse_name)} ${esc(s.spouse_job)} ${esc(s.spouse_phone)} | فرزند: ${esc(s.children)}<br>همراه: ${esc(s.mobile)} | ثابت: ${esc(s.home_phone)} | اضطراری: ${esc(s.emergency_phone)}<br>آدرس: ${esc(s.address)}<hr><b>رمز عبور:</b> ${s.must_change?(s.pw_is_code?('هنوز تغییر نداده؛ رمز فعلی همان کد پرسنلی است ('+esc(s.personnel_code)+')'):'رمز موقت توسط مدیر تعیین شده و هنوز تغییر نکرده است'):'توسط خود کاربر تغییر کرده و قابل مشاهده نیست'}<div class="row" style="margin-top:6px"><input id="npw" placeholder="رمز جدید (حداقل ۸ نویسه)" class="ltr" style="max-width:220px"><button class="btn sm" data-sp="${esc(s.id)}">تنظیم رمز</button><button class="btn sec sm" data-rp="${esc(s.id)}">بازنشانی به کد پرسنلی</button></div><hr><b>مدارک:</b> <span id="dl-${esc(s.id)}">…</span><div style="margin-top:8px"><button class="btn sec sm" data-p="${esc(s.id)}">🖨 چاپ فرم مشخصات</button></div></td></tr>`:'')).join('');
  $('#tb').querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{const s=list.find(x=>x.id===b.dataset.a);
    const {error}=await sb.rpc('set_approved',{uid:s.id,val:!s.approved});if(error)alert(error.message);else{await loadList();renderAdmin()}});
  $('#tb').querySelectorAll('[data-d]').forEach(a=>a.onclick=e=>{e.preventDefault();open=open===a.dataset.d?null:a.dataset.d;renderAdmin()});
  const setPw=async(id,v)=>{const {error}=await sb.rpc('admin_set_password',{target:id,new_password:v});
    if(error){alert('تنظیم رمز انجام نشد: '+error.message);return}
    alert('رمز تنظیم شد. کاربر در اولین ورود باید آن را تغییر دهد.');await loadList();renderAdmin()};
  $('#tb').querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{const v=$('#npw').value;if(v.length<8){alert('رمز باید حداقل ۸ نویسه باشد.');return}setPw(b.dataset.sp,v)});
  $('#tb').querySelectorAll('[data-rp]').forEach(b=>b.onclick=()=>{const t=list.find(x=>x.id===b.dataset.rp);if(!t||!t.personnel_code){alert('کد پرسنلی ثبت نشده است.');return}if(confirm('رمز به کد پرسنلی بازنشانی شود؟'))setPw(t.id,t.personnel_code)});
  $('#tb').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>printForm(list.find(x=>x.id===b.dataset.p)));
  if(open)loadAdminDocs(open);
}
$('#q').oninput=renderAdmin;$('#fl').onclick=()=>{onlyPending=!onlyPending;renderAdmin()};
$('#rf').onclick=async()=>{await loadList();renderAdmin()};
$('#ex').onclick=()=>{
  const H=['نام','ایمیل','کد ملی','کد پرسنلی','مدرک','رشته تحصیلی','رشته تدریس','سمت','سابقه خدمت (سال)','پایه‌های تدریس','روزهای همکاری','نام همسر','شغل همسر','تلفن همسر','تعداد فرزند','آدرس','همراه','تلفن ثابت','تلفن اضطراری','وضعیت'];
  const K=['full_name','email','national_id','personnel_code','degree','field_of_study','teaching_field','position','service_years','grades','work_days','spouse_name','spouse_job','spouse_phone','children','address','mobile','home_phone','emergency_phone'];
  const txt=new Set(['national_id','personnel_code','mobile','home_phone','emergency_phone','spouse_phone']);
  const cell=(v,t)=>{v=Array.isArray(v)?v.join('، '):String(v??'');v=v.replace(/"/g,'""');return t&&v?`"=""${v}"""`:`"${v}"`};
  const rows=list.map(s=>[...K.map(k=>cell(s[k],txt.has(k))),cell(s.approved?'تأییدشده':'در انتظار')].join(','));
  const blob=new Blob(['\ufeff'+[H.map(h=>`"${h}"`).join(','),...rows].join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='staff.csv';a.click();URL.revokeObjectURL(a.href);
};
