<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پورتال مدرسه</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#1d2433;--mu:#667085;--br:#d9deea;--pr:#2457c5;--prt:#fff;--ok:#117a45;--wn:#a15c07;--me:#e3ecff;--ot:#eef0f5}
@media (prefers-color-scheme:dark){:root{--bg:#121620;--card:#1b2130;--tx:#e8ecf5;--mu:#98a2b8;--br:#2b3347;--pr:#6b9bff;--prt:#0b1020;--ok:#4cc38a;--wn:#f0b45a;--me:#25355c;--ot:#262e42}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.7}
header{padding:14px 16px;background:var(--card);border-bottom:1px solid var(--br);display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:18px;margin:0}
nav{display:flex;gap:6px;padding:10px 16px;overflow-x:auto}
nav button{background:var(--card);border:1px solid var(--br);color:var(--tx);padding:8px 16px;border-radius:20px;font:inherit;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--pr);color:var(--prt);border-color:var(--pr)}
main{max-width:860px;margin:0 auto;padding:0 16px 32px}
.card{background:var(--card);border:1px solid var(--br);border-radius:12px;padding:16px;margin-bottom:14px}
.banner{padding:10px 14px;border-radius:10px;margin-bottom:14px;font-size:14px;border:1px solid var(--br);background:var(--card)}
.ok{color:var(--ok)}.wn{color:var(--wn)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:3px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--br);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.ltr{direction:ltr;text-align:right}
h3{margin:18px 0 8px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{display:flex;align-items:center;gap:5px;color:var(--tx);border:1px solid var(--br);padding:5px 10px;border-radius:16px;margin:0}
.chips input{width:auto}
.btn{background:var(--pr);color:var(--prt);border:0;padding:10px 20px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:var(--ot);color:var(--tx)}.btn.sm{padding:4px 12px;font-size:13px}
.err{font-size:13px;margin-top:6px;min-height:20px;color:#c0392b}
#msgs{height:55vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.m{max-width:80%;padding:8px 12px;border-radius:12px;background:var(--ot);align-self:flex-start;word-break:break-word}
.m.me{background:var(--me);align-self:flex-end}
.m b{font-size:12px;color:var(--mu);display:block}
.m .x{cursor:pointer;color:var(--mu);margin-inline-start:8px}
#cf,.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#cf{margin-top:10px;flex-wrap:nowrap}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px;border-bottom:1px solid var(--br);text-align:right;vertical-align:top}
.tw{overflow-x:auto}.det{background:var(--bg);font-size:13px;color:var(--mu)}
.tag{padding:2px 10px;border-radius:12px;font-size:12px;background:var(--ot)}
.hide{display:none}
#auth{max-width:380px;margin:40px auto}
</style>
</head>
<body>
<header><h1>🏫 پورتال مدیر و همکاران</h1><div class="row"><span id="who" class="tag hide"></span><button class="btn sec sm hide" id="out">خروج</button></div></header>

<main>
<section id="auth" class="card">
<h3 style="margin-top:0">ورود / ثبت‌نام</h3>
<label>ایمیل</label><input id="em" type="email" class="ltr" autocomplete="email">
<label style="margin-top:8px">رمز عبور (حداقل ۸ نویسه)</label><input id="pw" type="password" class="ltr" autocomplete="current-password">
<div class="err" id="aerr"></div>
<div class="row"><button class="btn" id="li">ورود</button><button class="btn sec" id="su">ثبت‌نام اولیه</button><button class="btn sec sm" id="fp">فراموشی رمز</button></div>
</section>

<div id="app" class="hide">
<nav id="nav" style="padding-inline:0"></nav>
<div id="banner"></div>

<section id="v-form" class="card hide">
<h3 style="margin-top:0">مشخصات فردی</h3>
<div class="grid">
<div><label>نام و نام خانوادگی *</label><input id="full_name"></div>
<div><label>کد ملی (۱۰ رقم) *</label><input id="national_id" class="ltr" inputmode="numeric" maxlength="10"></div>
<div><label>کد پرسنلی (۸ رقم) *</label><input id="personnel_code" class="ltr" inputmode="numeric" maxlength="8"></div>
<div><label>تلفن همراه *</label><input id="mobile" class="ltr" inputmode="tel"></div>
<div><label>تلفن ثابت</label><input id="home_phone" class="ltr" inputmode="tel"></div>
<div><label>تلفن اضطراری</label><input id="emergency_phone" class="ltr" inputmode="tel"></div>
</div>
<h3>تحصیلات و تدریس</h3>
<div class="grid">
<div><label>مدرک تحصیلی *</label><select id="degree"><option value="">انتخاب کنید</option><option>دیپلم</option><option>فوق دیپلم</option><option>لیسانس</option><option>فوق لیسانس</option><option>دکتری</option></select></div>
<div><label>رشته تحصیلی *</label><input id="field_of_study"></div>
<div><label>رشته تدریس *</label><input id="teaching_field"></div>
<div><label>سمت</label><input id="position"></div>
<div><label>سابقه خدمت (سال)</label><input id="service_years" type="number" min="0" max="60"></div>
</div>
<label style="margin-top:10px">پایه‌های تدریس</label><div class="chips" id="grades"></div>
<label style="margin-top:10px">روزهای همکاری</label><div class="chips" id="days"></div>
<h3>وضعیت خانوادگی</h3>
<div class="grid">
<div><label>نام همسر</label><input id="spouse_name"></div>
<div><label>شغل همسر</label><input id="spouse_job"></div>
<div><label>تلفن همسر</label><input id="spouse_phone" class="ltr" inputmode="tel"></div>
<div><label>تعداد فرزند</label><input id="children" type="number" min="0" max="30"></div>
</div>
<h3>نشانی</h3>
<label>آدرس محل سکونت *</label><textarea id="address" rows="3"></textarea>
<div class="err" id="ferr"></div>
<button class="btn" id="save">ثبت اطلاعات</button>
</section>

<section id="v-chat" class="card hide">
<div id="chatlock" class="banner wn hide">گفتگو پس از تأیید مدیر فعال می‌شود.</div>
<div id="msgs"></div>
<div id="cf"><input id="ct" placeholder="پیام خود را بنویسید…" maxlength="1000"><button class="btn" id="cs">ارسال</button></div>
</section>

<section id="v-admin" class="card hide">
<div class="row" style="margin-bottom:10px">
<input id="q" placeholder="جستجو: نام، کد ملی، کد پرسنلی…" style="flex:1;min-width:180px">
<button class="btn sec" id="rf">بازخوانی</button>
<button class="btn sec" id="fl">فقط در انتظار تأیید</button>
<button class="btn" id="ex">خروجی اکسل (CSV)</button>
</div>
<div class="tw"><table><thead><tr><th>نام</th><th>کد پرسنلی</th><th>رشته تدریس</th><th>وضعیت</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>
<div id="empty" class="banner hide">هنوز ثبت‌نامی انجام نشده است.</div>
</section>

<section id="v-acct" class="card hide">
<h3 style="margin-top:0">تغییر رمز عبور</h3>
<div class="grid" style="max-width:600px">
<div><label>رمز جدید (حداقل ۸ نویسه)</label><input id="np1" type="password" class="ltr" autocomplete="new-password"></div>
<div><label>تکرار رمز جدید</label><input id="np2" type="password" class="ltr" autocomplete="new-password"></div>
</div>
<div class="err" id="perr"></div>
<button class="btn" id="pb">تغییر رمز</button>
</section>
</div>
</main>

<script>
// ===== تنظیمات: مقادیر را از Supabase > Project Settings > API کپی کنید =====
const SUPABASE_URL=https://yxtwcrrcydcanbshpovf.supabase.co;
const SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4dHdjcnJjeWRjYW5ic2hwb3ZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5NzkyMDIsImV4cCI6MjEwNjU1NTIwMn0.EyKpBsbSvu2zsOuhcW9kIzjlZV8tBexy8gHBoET5uWc;
// ============================================================================
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dig=s=>String(s||'').replace(/[۰-۹]/g,d=>d.charCodeAt(0)-1776).replace(/[٠-٩]/g,d=>d.charCodeAt(0)-1632).trim();
const DAYS=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه'];
const GR=['اول','دوم','سوم','چهارم','پنجم','ششم','هفتم','هشتم','نهم','دهم','یازدهم','دوازدهم'];
const TXT=['full_name','national_id','personnel_code','mobile','home_phone','emergency_phone','degree','field_of_study','teaching_field','position','service_years','spouse_name','spouse_job','spouse_phone','children','address'];
const NUM=['service_years','children'];
let me=null,tab='form',list=[],msgs=[],open=null,onlyPending=false,chan=null,filled=false;
const chips=(id,arr)=>$(id).innerHTML=arr.map(d=>`<label><input type="checkbox" value="${d}">${d}</label>`).join('');
chips('#days',DAYS);chips('#grades',GR);
const checked=id=>[...document.querySelectorAll(id+' input:checked')].map(i=>i.value);
function validId(c){if(!/^\d{10}$/.test(c)||/^(\d)\1{9}$/.test(c))return false;let s=0;for(let i=0;i<9;i++)s+=+c[i]*(10-i);const r=s%11;return +c[9]===(r<2?r:11-r)}

// ---- ورود و ثبت‌نام ----
const cred=()=>({email:$('#em').value.trim(),password:$('#pw').value});
function aerr(m,good){const e=$('#aerr');e.textContent=m;e.style.color=good?'var(--ok)':'#c0392b'}
$('#li').onclick=async()=>{const {error}=await sb.auth.signInWithPassword(cred());aerr(error?'ایمیل یا رمز نادرست است.':'')};
$('#su').onclick=async()=>{const c=cred();if(c.password.length<8){aerr('رمز باید حداقل ۸ نویسه باشد.');return}
  const {data,error}=await sb.auth.signUp(c);
  if(error)aerr('ثبت‌نام انجام نشد: '+error.message);
  else if(!data.session)aerr('ثبت‌نام انجام شد. ایمیل خود را برای تأیید بررسی کنید و سپس وارد شوید.',true)};
$('#fp').onclick=async()=>{const e=$('#em').value.trim();if(!e){aerr('ابتدا ایمیل را وارد کنید.');return}
  await sb.auth.resetPasswordForEmail(e,{redirectTo:location.href.split('#')[0]});aerr('اگر این ایمیل ثبت شده باشد، لینک بازیابی ارسال شد.',true)};
$('#out').onclick=()=>sb.auth.signOut();
$('#pb').onclick=async()=>{const a=$('#np1').value,e=$('#perr');e.style.color='#c0392b';
  if(a.length<8){e.textContent='رمز باید حداقل ۸ نویسه باشد.';return}
  if(a!==$('#np2').value){e.textContent='تکرار رمز مطابقت ندارد.';return}
  const {error}=await sb.auth.updateUser({password:a});
  if(error){e.textContent='تغییر رمز انجام نشد: '+error.message;return}
  $('#np1').value=$('#np2').value='';e.style.color='var(--ok)';e.textContent='رمز با موفقیت تغییر کرد.'};

sb.auth.onAuthStateChange((ev,s)=>{if(ev==='TOKEN_REFRESHED')return;if(ev==='PASSWORD_RECOVERY')tab='acct';setTimeout(()=>onSession(s),0)});

async function onSession(s){
  if(chan){sb.removeChannel(chan);chan=null}
  if(!s){me=null;msgs=[];list=[];filled=false;$('#auth').classList.remove('hide');$('#app').classList.add('hide');$('#out').classList.add('hide');$('#who').classList.add('hide');return}
  const {data}=await sb.from('profiles').select('*').eq('id',s.user.id).single();
  me=data;filled=false;
  $('#auth').classList.add('hide');$('#app').classList.remove('hide');$('#out').classList.remove('hide');$('#who').classList.remove('hide');
  if(me&&(me.approved||me.role==='admin')){await loadMsgs();subscribe()}
  if(me?.role==='admin')await loadList();
  render();
}

// ---- نمایش ----
const isAdm=()=>me?.role==='admin',canChat=()=>me?.approved||isAdm();
function render(){
  if(!me)return;
  const tabs=[['form','مشخصات من'],['chat','گفتگو']];if(isAdm())tabs.push(['admin','پنل مدیر']);tabs.push(['acct','حساب']);
  if(!tabs.some(t=>t[0]===tab))tab='form';
  $('#nav').innerHTML=tabs.map(([k,l])=>`<button class="${k===tab?'on':''}" data-t="${k}">${l}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
  ['form','chat','admin','acct'].forEach(k=>$('#v-'+k).classList.toggle('hide',k!==tab));
  $('#who').textContent=isAdm()?'مدیر':(me.approved?'همکار تأییدشده':'ثبت‌نام اولیه');
  const b=$('#banner');
  if(isAdm()){b.className='banner ok';b.textContent='شما با دسترسی مدیر وارد شده‌اید.'}
  else if(!me.full_name){b.className='banner wn';b.textContent='برای تکمیل ثبت‌نام، فرم مشخصات را پر و ثبت کنید.'}
  else if(!me.approved){b.className='banner wn';b.textContent='اطلاعات شما ثبت شد و در انتظار تأیید مدیر است.'}
  else{b.className='banner ok';b.textContent='ثبت‌نام شما تأیید شده است.'}
  if(!filled){TXT.forEach(k=>$('#'+k).value=me[k]??'');
    document.querySelectorAll('#days input').forEach(i=>i.checked=(me.work_days||[]).includes(i.value));
    document.querySelectorAll('#grades input').forEach(i=>i.checked=(me.grades||[]).includes(i.value));filled=true}
  $('#chatlock').classList.toggle('hide',canChat());$('#cf').classList.toggle('hide',!canChat());
  renderChat();if(isAdm())renderAdmin();
}

$('#save').onclick=async()=>{
  const d={},e=$('#ferr');e.style.color='#c0392b';e.textContent='';
  TXT.forEach(k=>{const v=dig($('#'+k).value);d[k]=NUM.includes(k)?(v===''?null:+v):v});
  d.work_days=checked('#days');d.grades=checked('#grades');d.updated_at=new Date().toISOString();
  if(!d.full_name||!d.mobile||!d.degree||!d.field_of_study||!d.teaching_field||!d.address){e.textContent='لطفاً همه فیلدهای ستاره‌دار را پر کنید.';return}
  if(!validId(d.national_id)){e.textContent='کد ملی معتبر نیست.';return}
  if(!/^\d{8}$/.test(d.personnel_code)){e.textContent='کد پرسنلی باید دقیقاً ۸ رقم باشد.';return}
  const {error}=await sb.from('profiles').update(d).eq('id',me.id);
  if(error){e.textContent='ذخیره نشد: '+error.message;return}
  me={...me,...d};e.style.color='var(--ok)';e.textContent='اطلاعات با موفقیت ذخیره شد.';render();setTimeout(()=>e.textContent='',3000);
};

// ---- گفتگو ----
async function loadMsgs(){const {data}=await sb.from('messages').select('*').order('created_at',{ascending:false}).limit(200);msgs=(data||[]).reverse()}
function subscribe(){
  chan=sb.channel('msgs')
   .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},p=>{msgs.push(p.new);renderChat()})
   .on('postgres_changes',{event:'DELETE',schema:'public',table:'messages'},p=>{msgs=msgs.filter(m=>m.id!==p.old.id);renderChat()})
   .subscribe();
}
function renderChat(){
  const box=$('#msgs'),near=box.scrollHeight-box.scrollTop-box.clientHeight<80;box.innerHTML='';
  if(!canChat())return;
  msgs.forEach(m=>{const d=document.createElement('div');d.className='m'+(m.user_id===me.id?' me':'');
    const n=document.createElement('b');n.textContent=m.author||'';const t=document.createElement('span');t.textContent=m.body;d.append(n,t);
    if(isAdm()){const x=document.createElement('span');x.className='x';x.textContent='✕';x.onclick=()=>sb.from('messages').delete().eq('id',m.id);d.append(x)}
    box.append(d)});
  if(near)box.scrollTop=box.scrollHeight;
}
async function send(){const t=$('#ct').value.trim();if(!t)return;$('#ct').value='';
  const {error}=await sb.from('messages').insert({body:t});if(error)$('#ct').value=t}
$('#cs').onclick=send;$('#ct').onkeydown=e=>{if(e.key==='Enter')send()};

// ---- پنل مدیر ----
async function loadList(){const {data}=await sb.from('profiles').select('*').eq('role','teacher').order('created_at');list=data||[]}
function renderAdmin(){
  const q=dig($('#q').value);
  let L=list.filter(s=>!q||[s.full_name,s.national_id,s.personnel_code,s.teaching_field].some(v=>String(v||'').includes(q)));
  if(onlyPending)L=L.filter(s=>!s.approved);
  $('#empty').classList.toggle('hide',list.length>0);$('#fl').textContent=onlyPending?'نمایش همه':'فقط در انتظار تأیید';
  $('#tb').innerHTML=L.map(s=>`<tr><td><a href="#" data-d="${esc(s.id)}">${esc(s.full_name||s.email)}</a></td><td dir="ltr">${esc(s.personnel_code)}</td><td>${esc(s.teaching_field)}</td><td><span class="tag ${s.approved?'ok':'wn'}">${s.approved?'تأییدشده':'در انتظار'}</span></td><td><button class="btn sm ${s.approved?'sec':''}" data-a="${esc(s.id)}">${s.approved?'لغو تأیید':'تأیید'}</button></td></tr>`+(open===s.id?`<tr><td colspan="5" class="det">ایمیل: ${esc(s.email)} | کد ملی: ${esc(s.national_id)} | مدرک: ${esc(s.degree)} ${esc(s.field_of_study)}<br>سمت: ${esc(s.position)} | سابقه: ${esc(s.service_years)} سال | پایه‌ها: ${esc((s.grades||[]).join('، '))} | روزها: ${esc((s.work_days||[]).join('، '))}<br>همسر: ${esc(s.spouse_name)} ${esc(s.spouse_job)} ${esc(s.spouse_phone)} | فرزند: ${esc(s.children)}<br>همراه: ${esc(s.mobile)} | ثابت: ${esc(s.home_phone)} | اضطراری: ${esc(s.emergency_phone)}<br>آدرس: ${esc(s.address)}</td></tr>`:'')).join('');
  $('#tb').querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{const s=list.find(x=>x.id===b.dataset.a);
    const {error}=await sb.rpc('set_approved',{uid:s.id,val:!s.approved});if(error)alert(error.message);else{await loadList();renderAdmin()}});
  $('#tb').querySelectorAll('[data-d]').forEach(a=>a.onclick=e=>{e.preventDefault();open=open===a.dataset.d?null:a.dataset.d;renderAdmin()});
}
$('#q').oninput=renderAdmin;$('#fl').onclick=()=>{onlyPending=!onlyPending;renderAdmin()};
$('#rf').onclick=async()=>{await loadList();renderAdmin()};
$('#ex').onclick=()=>{
  const H=['نام','ایمیل','کد ملی','کد پرسنلی','مدرک','رشته تحصیلی','رشته تدریس','سمت','سابقه خدمت (سال)','پایه‌های تدریس','روزهای همکاری','نام همسر','شغل همسر','تلفن همسر','تعداد فرزند','آدرس','همراه','تلفن ثابت','تلفن اضطراری','وضعیت'];
  const K=['full_name','email','national_id','personnel_code','degree','field_of_study','teaching_field','position','service_years','grades','work_days','spouse_name','spouse_job','spouse_phone','children','address','mobile','home_phone','emergency_phone'];
  const txt=new Set(['national_id','personnel_code','mobile','home_phone','emergency_phone','spouse_phone']);
  const cell=(v,t)=>{v=Array.isArray(v)?v.join('، '):String(v??'');v=v.replace(/"/g,'""');return t&&v?`"=""${v}"""`:`"${v}"`};
  const rows=list.map(s=>[...K.map(k=>cell(s[k],txt.has(k))),cell(s.approved?'تأییدشده':'در انتظار')].join(','));
  const blob=new Blob(['\ufeff'+[H.map(h=>`"${h}"`).join(','),...rows].join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='staff.csv';a.click();URL.revokeObjectURL(a.href);
};
</script>
